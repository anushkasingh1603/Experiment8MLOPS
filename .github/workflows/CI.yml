name: ML pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Project code 
        uses: actions/checkout@v4
      - name: Setup Pyhton 
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" 
      -  name: Install dependencies
         run: pip install -r requirements.txt
      -  name: ML model Training
         run: python train.py 
      -  name: ML model Testing
         run: python test.py 
      -  name: ML model Testing       
         run: python app.py
             
    